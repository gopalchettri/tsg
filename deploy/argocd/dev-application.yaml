# ArgoCD watches deploy/overlays/dev and auto-syncs — this is what actually applies manifests
# to the cluster now (the Tekton pipeline only builds, tests, and commits the new image tag;
# see deploy/tekton/pipeline.yaml's update-manifest task).
# Apply once:  oc apply -f deploy/argocd/dev-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tsg-dev
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/gopalchettri/tsg.git
    targetRevision: tsg-without-profile-decomposition
    path: deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-threatgen-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
