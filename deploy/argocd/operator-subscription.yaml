# One-time install of the OpenShift GitOps operator (provides ArgoCD).
# Apply once:  oc apply -f deploy/argocd/operator-subscription.yaml
# After applying, wait for the operator to come up (a few minutes), then it auto-creates an
# ArgoCD instance in the `openshift-gitops` namespace:
#   oc get pods -n openshift-gitops
#   oc get route openshift-gitops-server -n openshift-gitops
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-gitops-operator
  namespace: openshift-operators
spec:
  channel: latest
  name: openshift-gitops-operator
  source: redhat-operators
  sourceNamespace: openshift-operators
  installPlanApproval: Automatic
