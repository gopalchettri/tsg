# FastAPI API — translated from docker/compose.prod.yml `api` service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsg-api
  labels:
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: tsg
      containers:
        - name: api
          image: tsg  # overridden per-overlay via the kustomize images transformer
          command: ["gunicorn", "app.main:app", "-k", "uvicorn.workers.UvicornWorker",
                    "-w", "4", "-b", "0.0.0.0:8000", "--timeout", "120",
                    "--graceful-timeout", "30"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tsg-config
            - secretRef:
                name: tsg-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
