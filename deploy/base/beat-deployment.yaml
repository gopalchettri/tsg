# Celery beat — translated from docker/compose.prod.yml `beat` service.
# EXACTLY 1 replica, strategy Recreate: two beats double-fire every schedule entry.
# -A target is the UNpatched app.pipeline.celery_app (worker uses celery_worker) — see
# worker-deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsg-beat
  labels:
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/component: beat
    spec:
      serviceAccountName: tsg
      containers:
        - name: beat
          image: tsg  # overridden per-overlay via the kustomize images transformer
          # -s: PersistentScheduler writes celerybeat-schedule.* to CWD by default; /tmp is
          # writable under any SCC. The file is throwaway state (schedule is code-defined).
          command: ["celery", "-A", "app.pipeline.celery_app.celery_app", "beat",
                    "-l", "info", "-s", "/tmp/celerybeat-schedule"]
          envFrom:
            - configMapRef:
                name: tsg-config
            - secretRef:
                name: tsg-secrets
          # Beat has no `inspect ping`; check the schedule file's mtime instead. Celery's
          # hardcoded sync_every=180s means the real write cadence is ~180-240s, so 360s is
          # the threshold (2x worst case) — same reasoning as compose.prod.yml.
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c",
                        "find /tmp -maxdepth 1 -name 'celerybeat-schedule*' -newermt '-360 seconds' | grep -q ."]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
