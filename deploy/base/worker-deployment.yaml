# Celery worker — translated from docker/compose.prod.yml `worker` service.
# NOTE the -A target: app.pipeline.celery_worker (gevent monkey-patched). Beat uses the
# UNpatched app.pipeline.celery_app — swapping them hangs the process.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsg-worker
  labels:
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: tsg
      # One in-flight LLM call can legitimately take llm_timeout x (retries+1) = up to 270s;
      # the k8s default 30s grace would hard-kill mid-work (same rationale as compose's
      # stop_grace_period: 300s).
      terminationGracePeriodSeconds: 300
      containers:
        - name: worker
          image: tsg  # overridden per-overlay via the kustomize images transformer
          # -E: emit task-events (task-received/started/succeeded/failed) on the broker — without
          # it Flower (deploy/overlays/uat/flower-deployment.yaml) only sees worker heartbeats,
          # not the actual task list. Sender-side "task-sent" events (from the API/beat calling
          # .delay()) still won't appear unless celery_app.py sets task_send_sent_event=True —
          # out of scope here (app code, not deploy config).
          command: ["celery", "-A", "app.pipeline.celery_worker.celery_app", "worker",
                    "-P", "gevent", "-c", "50", "-l", "info", "-E"]
          envFrom:
            - configMapRef:
                name: tsg-config
            - secretRef:
                name: tsg-secrets
          # `inspect ping` without -d broadcasts over the broker, so with >1 replica a dead
          # pod would look alive because a SIBLING replied. -d pins the ping to THIS pod
          # (Celery's default nodename is celery@<hostname>).
          startupProbe:
            exec:
              command: ["/bin/sh", "-c",
                        "celery -A app.pipeline.celery_worker.celery_app inspect ping -d celery@$HOSTNAME --timeout 10"]
            periodSeconds: 15
            timeoutSeconds: 12
            failureThreshold: 20  # 300s budget: worker_init warm-load routinely exceeds 240s
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c",
                        "celery -A app.pipeline.celery_worker.celery_app inspect ping -d celery@$HOSTNAME --timeout 10"]
            periodSeconds: 30
            timeoutSeconds: 12
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
