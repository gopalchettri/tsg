apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: tsg
  annotations:
    # SSE streams are long-lived; the router default (30s) would cut them. sse-starlette
    # sends 15s keepalive pings, so this is an inactivity timeout that never fires in
    # a healthy stream.
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: tsg-api
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
