# TSG on OpenShift — api + worker + beat + Service + PDBs. This file is the TARGET state and
# only lands via `oc apply -f deploy/deploy.yaml` — a `rollout restart` alone never pushes this
# template (live UAT ran --concurrency=2 with no liveness probe until this was applied). Roll
# api and worker SEQUENTIALLY (oc rollout status between them): their combined surge pods
# exceed a limits-capped 6-CPU namespace quota.
#
# NOTE on image tag: :latest + IfNotPresent only repulls when the tag is missing locally. Better:
# have CI push immutable tags (git SHA) and set them here.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsg-api
  namespace: ai-threatgen
  labels:
    app: tsg-api
    component: fastapi
spec:
  # 2 replicas is what actually provides availability. A namespace is a quota boundary, not an
  # availability boundary — a second copy in another namespace lands on the same nodes and dies
  # with them, so replicas + anti-affinity is the mechanism, not namespace count.
  replicas: 2
  selector:
    matchLabels:
      app: tsg-api
      component: fastapi
  template:
    metadata:
      labels:
        app: tsg-api
        component: fastapi
    spec:
      affinity:
        podAntiAffinity:
          # PREFERRED, not required: on a small cluster `required` leaves the second replica
          # Pending forever rather than merely co-located — turning a resilience improvement into
          # an outage. Weight 100 means the scheduler separates them whenever it can.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: tsg-api
                    component: fastapi
      # Cluster DNS can't resolve this UAT LLM gateway host — pin it directly. Traffic still goes
      # through HTTP_PROXY/HTTPS_PROXY below (TSG_LITELLM_BYPASS_PROXY=false in the Secret makes
      # the app actually use them for this host instead of self-forcing a direct connection).
      hostAliases:
        - ip: "10.231.255.253"
          hostnames:
            - "llmapi.govai.ae"
      imagePullSecrets:
        - name: quay-pull
      containers:
        - name: fastapi
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/tsg-api:latest
          imagePullPolicy: Always  # mutable ':latest' tag — IfNotPresent never repulls
          command:
            - gunicorn
            - app.main:app
            - -k
            - uvicorn.workers.UvicornWorker
            - --bind
            - 0.0.0.0:8000
            - --workers
            - "2"
            - --timeout
            - "240"
          ports:
            - containerPort: 8000
              protocol: TCP
          # Corporate proxy required for external egress in this cluster (network support).
          env:
            - name: HTTP_PROXY
              value: "http://10.61.192.2:8080"
            - name: HTTPS_PROXY
              value: "http://10.61.192.2:8080"
          envFrom:
            - configMapRef:
                name: tsg-api-config
            - secretRef:
                name: tsg-api-secrets
          # READINESS = "can this pod serve traffic?" -> /ready, which checks the database,
          # Redis and (when in use) Mongo. NOT /health: that returns 200 unconditionally by
          # design (app/api/health.py), so probing it here kept pods with a dead DB in the
          # Service endpoints. Enforced by tests/test_deploy_manifest.py.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # LIVENESS = "is the process wedged?" -> /health, the unconditional 200. Deliberately
          # NOT /ready: a transient DB outage must not make Kubernetes restart every API pod,
          # which turns a dependency blip into a crash-loop. failureThreshold is generous for
          # the same reason.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: ai-threatgen
  labels:
    app: tsg-api
    component: celery
spec:
  # Workers are stateless queue consumers: every replica pulls from the SAME external Redis
  # broker (TSG_REDIS_CELERY_BROKER_URL), so scaling out needs no Service, no Route and no
  # coordination between pods. Worker-only replicas may also run in ANOTHER namespace pointed at
  # the same broker — they join this queue transparently, which is how a second namespace's quota
  # becomes extra capacity for one application. Never copy tsg-beat alongside them (see its
  # singleton note below).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tsg-api
      component: celery
  template:
    metadata:
      labels:
        app: tsg-api
        component: celery
    spec:
      affinity:
        podAntiAffinity:
          # Preferred, not required — see the same note on tsg-api: `required` would leave a
          # replica Pending on a cluster with fewer nodes than replicas.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: tsg-api
                    component: celery
      # Cluster DNS can't resolve this UAT LLM gateway host — pin it directly. Traffic still goes
      # through HTTP_PROXY/HTTPS_PROXY below (TSG_LITELLM_BYPASS_PROXY=false in the Secret makes
      # the app actually use them for this host instead of self-forcing a direct connection).
      hostAliases:
        - ip: "10.231.255.253"
          hostnames:
            - "llmapi.govai.ae"
      # Covers one full LLM-call retry cycle on warm shutdown: llm_timeout(180) x (retries 3+1)
      # = 720s, + the 10s preStop + margin. At the old 300 every rollout SIGKILLed a worker
      # mid-retry and parked its session on lease recovery. A call already in its FALLBACK
      # chain (TSG_INFERENCE_FALLBACK_MODEL) can run up to 1440s and still be cut — accepted:
      # a ~1460s grace would stall node drains for 24 min per pod; the (now 2880s) lease
      # recovery absorbs that rare case instead.
      terminationGracePeriodSeconds: 740
      imagePullSecrets:
        - name: quay-pull
      containers:
        - name: celery-worker
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/tsg-api:latest
          imagePullPolicy: Always  # mutable ':latest' tag — IfNotPresent never repulls
          command:
            - celery
            - -A
            - app.pipeline.celery_worker:celery_app
            - worker
            - --loglevel=INFO
            # gevent concurrency is GREENLETS, not CPU cores. This work is almost entirely spent
            # waiting on network I/O to the LLM proxy, so 2 was a hard ceiling of two in-flight
            # tasks per pod no matter how much CPU the pod was given (compose uses -c 50).
            # Step 10 -> 20 only while watching celery_task_queued_time_seconds AND runtime:
            # queued-time falling with flat runtime = win; runtime rising = provider saturated,
            # revert. TSG_MAX_CONCURRENT_LLM_CALLS stays 0 DELIBERATELY (see secrets source):
            # the backend queues via continuous batching; a semaphore would turn that benign
            # queuing into LLMSlotUnavailable task retries. Load is bounded by pods x this flag
            # and vLLM/SGLang's own --max-num-seqs.
            - --concurrency=10
            # Keep at 1: pipeline tasks run for minutes, so prefetching would let one pod hoard
            # queued work that an idle pod could have taken.
            - --prefetch-multiplier=1
            - --soft-time-limit=3300
            - --time-limit=3600
            - --pool=gevent
          # Corporate proxy required for external egress in this cluster (network support).
          env:
            - name: HTTP_PROXY
              value: "http://10.61.192.2:8080"
            - name: HTTPS_PROXY
              value: "http://10.61.192.2:8080"
          envFrom:
            - configMapRef:
                name: tsg-api-config
            - secretRef:
                name: tsg-api-secrets
          # Sized for the PROXY path, not the local-model path. With
          # TSG_EMBEDDING_PROVIDER=litellm_proxy no sentence-transformers model is ever loaded, so
          # the old 4Gi/8Gi was reserving memory nothing used. gevent is I/O-bound too, so many
          # small workers beat one large one — and two replicas at these values fit the namespace
          # quota where one at the old values did not.
          resources:
            requests:
              cpu: "750m"
              memory: "1536Mi"
            limits:
              # 1 CPU, not more: gevent I/O-bound work rarely exceeds one core, and the lower
              # limit is what keeps a rollout surge pod admissible under a limits-capped 6-CPU
              # namespace quota (steady-state limits 4.5 + 1 surge = 5.5 of 6).
              cpu: "1"
              memory: "3Gi"
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep 10"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsg-beat
  namespace: ai-threatgen
  labels:
    app: tsg-api
    component: beat
spec:
  replicas: 1
  # Two concurrent beats double-fire every scheduled task — Recreate guarantees the old pod
  # is gone before the new one starts. Never scale this above 1.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tsg-api
      component: beat
  template:
    metadata:
      labels:
        app: tsg-api
        component: beat
    spec:
      imagePullSecrets:
        - name: quay-pull
      containers:
        - name: beat
          # SAME image AND pull policy as the api and celery-worker Deployments above — beat
          # schedules the sweeps the workers execute, so a different repo/tag/policy here means
          # the scheduler and the executors can run different builds (Always would repull the
          # mutable :latest on every beat restart while the executors keep their cached one).
          # Repo spelling: BOTH manifests (this + deploy.ai-remediation.yaml) and every push
          # command must use ONE spelling — confirm it against the live registry before the
          # first apply (runbook Phase 0). Split spellings make the two namespaces run
          # different builds against the same queue.
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/tsg-api:latest
          imagePullPolicy: Always  # mutable ':latest' tag — IfNotPresent never repulls
          # compose.prod.yml:100 verbatim — celery_app, NOT celery_worker: beat runs on plain
          # asyncio and must never be monkey-patched (celery_app.py module docstring).
          command:
            - celery
            - -A
            - app.pipeline.celery_app.celery_app
            - beat
            - -l
            - info
          # SAME env sources as tsg-api and celery-worker. This previously read a separate
          # `tsg-uat-env` Secret, so beat could run with different settings than the workers
          # executing what it schedules. Enforced by tests/test_deploy_manifest.py.
          envFrom:
            - configMapRef:
                name: tsg-api-config
            - secretRef:
                name: tsg-api-secrets
          # compose.prod.yml:115 — beat has no ping; check the schedule file's mtime instead.
          # Real sync cadence is ~180-240s (PersistentScheduler.sync_every), so 360s is the
          # tightest honest threshold. Schedule file lands in /app (group-writable, ephemeral —
          # fine: the schedule is interval-based, nothing to persist).
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - find /app -maxdepth 1 -name 'celerybeat-schedule*' -newermt '-360 seconds' | grep -q .
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: tsg-api
  namespace: ai-threatgen
  labels:
    app: tsg-api
spec:
  selector:
    app: tsg-api
    component: fastapi
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

# --- Route: uncomment if the API must be reachable from outside the cluster. If EYShield
# --- calls it in-cluster, the Service above is enough and no Route should exist.
