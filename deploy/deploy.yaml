---
# PodDisruptionBudgets — what makes replicas: 2 survive the node maintenance it exists for
# (without a PDB a drain may evict both replicas at once). Selectors are COMPONENT-scoped on
# purpose: all three workloads share app=tsg-api (that is how the litellm NetworkPolicy selects
# them), so an app-only selector would also cover tsg-beat AND double-cover these pods — and a
# pod matched by more than one PDB makes the eviction API refuse outright, wedging every drain.
# tsg-beat gets NO PDB: minAvailable 1 on a singleton blocks drains forever; strategy Recreate
# plus the schedule-mtime liveness probe is its availability story.
# Enforced by tests/test_deploy_manifest.py.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tsg-api
  namespace: ai-threatgen
  labels:
    app: tsg-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: tsg-api
      component: fastapi

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: celery-worker
  namespace: ai-threatgen
  labels:
    app: tsg-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: tsg-api
      component: celery
