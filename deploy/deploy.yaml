# TSG on OpenShift — api + worker + beat + Service.
# tsg-api and celery-worker are reconciled to match what's actually live in UAT (envFrom via
# tsg-api-config ConfigMap + tsg-api-secrets Secret, concurrency=2, single readinessProbe, no
# startup/liveness probes) — see deploy/secrets.yaml comment for why. tsg-beat and the Service
# below were not part of that reconciliation and still reflect the prior single-Secret design.
#
# NOTE on image tag: :latest + IfNotPresent only repulls when the tag is missing locally. Better:
# have CI push immutable tags (git SHA) and set them here.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsg-api
  namespace: ai-threatgen
  labels:
    app: tsg-api
    component: fastapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tsg-api
      component: fastapi
  template:
    metadata:
      labels:
        app: tsg-api
        component: fastapi
    spec:
      # Cluster DNS can't resolve this UAT LLM gateway host — pin it directly. Traffic still goes
      # through HTTP_PROXY/HTTPS_PROXY below (TSG_LITELLM_BYPASS_PROXY=false in the Secret makes
      # the app actually use them for this host instead of self-forcing a direct connection).
      hostAliases:
        - ip: "10.231.255.253"
          hostnames:
            - "llmapi.govai.ae"
      imagePullSecrets:
        - name: quay-pull
      containers:
        - name: fastapi
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/tsg-apii:latest
          imagePullPolicy: IfNotPresent
          command:
            - gunicorn
            - app.main:app
            - -k
            - uvicorn.workers.UvicornWorker
            - --bind
            - 0.0.0.0:8000
            - --workers
            - "2"
            - --timeout
            - "240"
          ports:
            - containerPort: 8000
              protocol: TCP
          # Corporate proxy required for external egress in this cluster (network support).
          env:
            - name: HTTP_PROXY
              value: "http://10.61.192.2:8080"
            - name: HTTPS_PROXY
              value: "http://10.61.192.2:8080"
          envFrom:
            - configMapRef:
                name: tsg-api-config
            - secretRef:
                name: tsg-api-secrets
          # /health = process up, unconditional 200 (app/api/health.py).
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: ai-threatgen
  labels:
    app: tsg-api
    component: celery
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tsg-api
      component: celery
  template:
    metadata:
      labels:
        app: tsg-api
        component: celery
    spec:
      # Cluster DNS can't resolve this UAT LLM gateway host — pin it directly. Traffic still goes
      # through HTTP_PROXY/HTTPS_PROXY below (TSG_LITELLM_BYPASS_PROXY=false in the Secret makes
      # the app actually use them for this host instead of self-forcing a direct connection).
      hostAliases:
        - ip: "10.231.255.253"
          hostnames:
            - "llmapi.govai.ae"
      # compose stop_grace_period: 300s — covers one full LLM-call retry cycle on warm shutdown.
      terminationGracePeriodSeconds: 300
      imagePullSecrets:
        - name: quay-pull
      containers:
        - name: celery-worker
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/tsg-apii:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.pipeline.celery_worker:celery_app
            - worker
            - --loglevel=INFO
            - --concurrency=2
            - --prefetch-multiplier=1
            - --soft-time-limit=3300
            - --time-limit=3600
            - --pool=gevent
          # Corporate proxy required for external egress in this cluster (network support).
          env:
            - name: HTTP_PROXY
              value: "http://10.61.192.2:8080"
            - name: HTTPS_PROXY
              value: "http://10.61.192.2:8080"
          envFrom:
            - configMapRef:
                name: tsg-api-config
            - secretRef:
                name: tsg-api-secrets
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep 10"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsg-beat
  namespace: ai-threatgen
  labels:
    app: tsg-api
    component: beat
spec:
  replicas: 1
  # Two concurrent beats double-fire every scheduled task — Recreate guarantees the old pod
  # is gone before the new one starts. Never scale this above 1.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tsg-api
      component: beat
  template:
    metadata:
      labels:
        app: tsg-api
        component: beat
    spec:
      imagePullSecrets:
        - name: quay-pull
      containers:
        - name: beat
          # SAME image AND pull policy as the api and celery-worker Deployments above — beat
          # schedules the sweeps the workers execute, so a different repo/tag/policy here means
          # the scheduler and the executors can run different builds (Always would repull the
          # mutable :latest on every beat restart while the executors keep their cached one).
          # Confirm the live repo spelling ('tsg-apii') against the cluster registry before
          # applying.
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/tsg-apii:latest
          imagePullPolicy: IfNotPresent
          # compose.prod.yml:100 verbatim — celery_app, NOT celery_worker: beat runs on plain
          # asyncio and must never be monkey-patched (celery_app.py module docstring).
          command:
            - celery
            - -A
            - app.pipeline.celery_app.celery_app
            - beat
            - -l
            - info
          envFrom:
            - secretRef:
                name: tsg-uat-env
          # compose.prod.yml:115 — beat has no ping; check the schedule file's mtime instead.
          # Real sync cadence is ~180-240s (PersistentScheduler.sync_every), so 360s is the
          # tightest honest threshold. Schedule file lands in /app (group-writable, ephemeral —
          # fine: the schedule is interval-based, nothing to persist).
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - find /app -maxdepth 1 -name 'celerybeat-schedule*' -newermt '-360 seconds' | grep -q .
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: tsg-api
  namespace: ai-threatgen
  labels:
    app: tsg-api
spec:
  selector:
    app: tsg-api
    component: fastapi
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

