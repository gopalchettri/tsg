apiVersion: v1
kind: ConfigMap
metadata:
  name: tsg-config
data:
  APP_ENV: dev
  # Dev auth: x-dev-entities headers instead of real JWTs. Fail-closed boot rejects this
  # outside APP_ENV=dev, so it can never leak into uat/prod.
  AUTH_DEV_MODE: "true"
  # In-cluster dev Redis (redis.yaml), no credentials — ConfigMap-safe here only.
  # If tsg-secrets also defines TSG_REDIS_URL, the Secret wins (envFrom order).
  TSG_REDIS_URL: "redis://tsg-redis:6379/0"
