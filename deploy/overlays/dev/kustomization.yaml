apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-threatgen-dev

resources:
  - ../../base
  - redis.yaml

# The pipeline's update-manifest task rewrites newTag to the git short SHA and commits this
# file back to git; ArgoCD picks up the commit and applies it.
images:
  - name: tsg
    newName: image-registry.openshift-image-registry.svc:5000/ai-threatgen-ci/tsg
    newTag: latest

patches:
  - path: configmap-patch.yaml
