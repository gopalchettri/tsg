# Celery Flower — web dashboard for monitoring the tsg-worker/tsg-beat Celery cluster.
# UAT-only per request. Uses the official image (not the app's own build) since flower isn't
# an app dependency (pyproject.toml) — no image rebuild needed, it just needs the same broker
# URL the worker uses. Copy this file + its kustomization.yaml resource line to dev/prod if you
# want the dashboard there too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsg-flower
  labels:
    app.kubernetes.io/component: flower
    app.kubernetes.io/name: tsg
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: flower
      app.kubernetes.io/name: tsg
  template:
    metadata:
      labels:
        app.kubernetes.io/component: flower
        app.kubernetes.io/name: tsg
    spec:
      serviceAccountName: tsg
      containers:
        - name: flower
          image: mher/flower:2.0
          args: ["--port=5555"]
          ports:
            - name: http
              containerPort: 5555
          env:
            # Flower reads the broker URL itself; it doesn't need the rest of tsg-config/tsg-secrets.
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: tsg-secrets
                  key: TSG_REDIS_URL
            # Dashboard exposes task args/results — must not be anonymous. Format: user:pass.
            - name: FLOWER_BASIC_AUTH
              valueFrom:
                secretKeyRef:
                  name: tsg-secrets
                  key: TSG_FLOWER_BASIC_AUTH
          # Not an httpGet probe: FLOWER_BASIC_AUTH would 401 an unauthenticated kubelet probe.
          readinessProbe:
            tcpSocket:
              port: 5555
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5555
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: tsg-flower
spec:
  selector:
    app.kubernetes.io/component: flower
  ports:
    - name: http
      port: 5555
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: tsg-flower
spec:
  to:
    kind: Service
    name: tsg-flower
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
