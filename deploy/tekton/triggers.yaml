# GitHub webhook -> auto PipelineRun with env=dev. uat/prod stay manual (pipelinerun-example.yaml).
# REQUIRES: the EventListener Route must be reachable FROM github.com. If the cluster only has
# outbound internet, skip this file and start runs manually (tkn pipeline start tsg-pipeline).
# Loop guard: the pipeline's update-manifest task pushes its own "deploy(...)" commits back to
# this branch — the cel filter below skips those pushes so they don't re-trigger the pipeline.
# Webhook secret:  oc -n ai-threatgen-ci create secret generic github-webhook-secret --from-literal=secretToken=<random>
# Apply once:      oc apply -f deploy/tekton/triggers.yaml -n ai-threatgen-ci
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: tsg-trigger-template
spec:
  params:
    - name: git-revision
    - name: git-url
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: tsg-dev-
      spec:
        pipelineRef:
          name: tsg-pipeline
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
          - name: env
            value: dev
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 1Gi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: tsg-trigger-binding
spec:
  params:
    - name: git-revision
      value: $(body.head_commit.id)
    - name: git-url
      value: $(body.repository.clone_url)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: tsg
spec:
  serviceAccountName: pipeline
  triggers:
    - name: github-push
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: ["push"]
        - ref:
            name: "cel"
          params:
            - name: "filter"
              value: "!body.head_commit.message.startsWith('deploy(')"
      bindings:
        - ref: tsg-trigger-binding
      template:
        ref: tsg-trigger-template
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: tsg-webhook
spec:
  to:
    kind: Service
    name: el-tsg  # Triggers creates this Service for the EventListener
  port:
    targetPort: http-listener
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
