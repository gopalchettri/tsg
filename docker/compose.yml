# Local dev/test infra for the TSG vertical slice.
# `docker compose -f docker/compose.yml up -d` then run Alembic + the app.
# GPU model-serving (TEI/vLLM) is not included — tests use a deterministic
# litellm stub (fixed-latency echo); point TSG_LITELLM_BASE_URL at real serving
# for integration against models.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev_Str0ng_Pass!"   # dev only
    ports: ["1433:1433"]
    volumes: ["mssql-data:/var/opt/mssql"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/litellm.config.yaml", "--port", "4000"]
    ports: ["4000:4000"]
    volumes: ["./litellm.config.yaml:/app/litellm.config.yaml:ro"]
    # ≥2 replicas in OpenShift ([R8]); one is fine locally.

volumes:
  mssql-data:
  mongo-data:
