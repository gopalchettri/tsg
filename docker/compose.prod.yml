# Production-style run of the three TSG processes from one image.
# Usage (from the tsg folder):
#   docker build -t tsg:latest .            # add --build-arg EXTRAS=prod,local for in-process models
#   docker compose -f docker/compose.prod.yml --env-file .env.uat up -d
#
# MSSQL (TSG) is EXTERNAL — point TSG_DB_DSN in .env.uat at your real server.
# The api/worker `volumes:` blocks below carry a DEFAULT host path, so they are inert for the
# UAT/prod config (.env.uat runs EMBEDDING/RERANKER_PROVIDER=litellm_proxy — models live on the
# GPU cluster, nothing local is read). They previously interpolated bare
# ${EMBEDDING_MODEL_HOST}, which aborted `compose up` outright whenever those vars were unset —
# i.e. on exactly the proxy-based deployment this file is used for. To run in-process models
# instead, set EMBEDDING_MODEL_HOST/RERANKER_MODEL_HOST to real host directories and point
# EMBEDDING_MODEL/RERANKER_MODEL at the CONTAINER paths (/models/...).
services:
  api:
    image: tsg:latest
    command: ["gunicorn", "app.main:app", "-k", "uvicorn.workers.UvicornWorker",
              "-w", "4", "-b", "0.0.0.0:8000", "--timeout", "120"]
    env_file: [../.env.uat]   # UAT and production share one file (.env.prod.example documents it)
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:  # local models (default provider=local); host paths come from .env.prod
      # Defaults so an unset MODEL_HOST cannot abort `compose up`: this deployment runs
      # EMBEDDING/RERANKER_PROVIDER=litellm_proxy (.env.uat), so no local model files are needed
      # and nothing reads these paths. Set both vars in .env.uat to real host directories only if
      # you switch a provider back to `local`.
      - "${EMBEDDING_MODEL_HOST:-./docker}:/models/e5:ro"
      - "${RERANKER_MODEL_HOST:-./docker}:/models/reranker:ro"

  worker:
    image: tsg:latest
    command: ["celery", "-A", "app.pipeline.celery_worker.celery_app", "worker",
              "-P", "gevent", "-c", "50", "-l", "info"]
    env_file: [../.env.uat]   # UAT and production share one file (.env.prod.example documents it)
    depends_on:
      redis: { condition: service_healthy }
    # Compose's 10s default (SIGTERM then SIGKILL) is far shorter than a single in-flight LLM
    # call can legitimately take (llm_timeout_seconds x llm_max_retries = up to 270s), so every
    # routine restart/redeploy/scale-down would hard-kill mid-work instead of letting Celery's
    # warm shutdown finish it — the same "orphaned message" exposure a killed worker causes
    # (see app/pipeline/celery_app.py's visibility_timeout comment). 300s covers one full
    # LLM-call retry cycle; a reasoned starting point, not measured against this deployment's
    # real P99 stage duration — tune once that data exists.
    stop_grace_period: 300s
    # [REVIEW-FIX] worker previously had no healthcheck at all — a gevent greenlet deadlock
    # leaves the container process alive (Docker sees no crash) with nothing to restart it.
    # `inspect ping` only succeeds if the worker's event loop is actually responsive, not just
    # that the process exists.
    # [REVIEW-FIX] start_period: `inspect ping` can't get a reply until Celery's Consumer
    # bootstep is up, which only happens AFTER the synchronous worker_init handler
    # (_init_worker, app/pipeline/celery_app.py) fully returns — a DB round-trip, a local
    # embedding+reranker model warm-load (EMBEDDING/RERANKER_PROVIDER=local is the documented
    # default; two real transformer models loaded from the bind-mounted volumes above) and an
    # LLM-provider reachability ping, all blocking, all before the first tick. That routinely
    # exceeds 30s (30s was measured against nothing — a reasoned starting point, tune down once
    # this deployment's real cold-start P99 is known); until then every ping fails not because
    # the worker is unhealthy but because it legitimately hasn't finished booting yet.
    healthcheck:
      test: ["CMD", "celery", "-A", "app.pipeline.celery_worker.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    volumes:
      # Defaults so an unset MODEL_HOST cannot abort `compose up`: this deployment runs
      # EMBEDDING/RERANKER_PROVIDER=litellm_proxy (.env.uat), so no local model files are needed
      # and nothing reads these paths. Set both vars in .env.uat to real host directories only if
      # you switch a provider back to `local`.
      - "${EMBEDDING_MODEL_HOST:-./docker}:/models/e5:ro"
      - "${RERANKER_MODEL_HOST:-./docker}:/models/reranker:ro"

  beat:
    image: tsg:latest
    command: ["celery", "-A", "app.pipeline.celery_app.celery_app", "beat", "-l", "info"]
    env_file: [../.env.uat]   # UAT and production share one file (.env.prod.example documents it)
    depends_on:
      redis: { condition: service_healthy }
    # [REVIEW-FIX] beat has no `inspect ping` equivalent, so this checks its own schedule
    # file's mtime instead. [REVIEW-FIX] the file is NOT touched every time an entry fires —
    # PersistentScheduler.should_sync() (celery/beat.py) is gated by Celery's own hardcoded
    # `Scheduler.sync_every = 180`, which this app never overrides (no beat_sync_every set), so
    # a disk sync only happens the first tick where time-since-last-sync exceeds 180s. Since
    # that check itself only runs on ~60s ticks (the reaper is the soonest-due entry), the real
    # write cadence is ~180-240s, not ~60s — so the file legitimately sits stale past 180s for
    # part of every normal cycle even while beat is perfectly healthy. 360s (2x the ~240s
    # worst-case real cadence) is comfortably above that, not just 3x an interval that isn't
    # actually how this scheduler behaves.
    healthcheck:
      test: ["CMD-SHELL", "find /app -maxdepth 1 -name 'celerybeat-schedule*' -newermt '-360 seconds' | grep -q ."]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
