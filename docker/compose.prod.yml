# Production-style run of the three TSG processes from one image.
# Usage (from the tsg folder):
#   docker build -t tsg:latest .            # add --build-arg EXTRAS=prod,local for in-process models
#   docker compose -f docker/compose.prod.yml --env-file .env.uat up -d
#
# MSSQL (TSG) is EXTERNAL — point TSG_DB_DSN in .env.uat at your real server.
# The api/worker `volumes:` blocks below carry a DEFAULT host path, so they are inert for the
# UAT/prod config (.env.uat runs EMBEDDING/RERANKER_PROVIDER=litellm_proxy — models live on the
# GPU cluster, nothing local is read). They previously interpolated bare
# ${EMBEDDING_MODEL_HOST}, which aborted `compose up` outright whenever those vars were unset —
# i.e. on exactly the proxy-based deployment this file is used for. To run in-process models
# instead, set EMBEDDING_MODEL_HOST/RERANKER_MODEL_HOST to real host directories and point
# EMBEDDING_MODEL/RERANKER_MODEL at the CONTAINER paths (/models/...).
services:
  api:
    image: tsg:latest
    # restart on every service: healthchecks (below) only MARK a container unhealthy — nothing
    # acted on a crash until this. Beat matters most: a dead beat = no reaper = a crashed
    # session holds its per-asset lock (409) until a human notices.
    restart: unless-stopped
    command: ["gunicorn", "app.main:app", "-k", "uvicorn.workers.UvicornWorker",
              "-w", "4", "-b", "0.0.0.0:8000", "--timeout", "120"]
    env_file: [../.env.uat]   # UAT and production share one file (.env.prod.example documents it)
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
    # Compose's 10s default (SIGTERM then SIGKILL) is well under gunicorn's own 30s
    # --timeout/graceful-timeout, so Docker would SIGKILL the api container mid-drain, before
    # gunicorn's own grace period (and, inside it, sse_shutdown_grace_seconds's SSE drain window)
    # ever gets to finish. 40s gives gunicorn's 30s margin to complete before Docker escalates.
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:  # local models (default provider=local); host paths come from .env.prod
      # Defaults so an unset MODEL_HOST cannot abort `compose up`: this deployment runs
      # EMBEDDING/RERANKER_PROVIDER=litellm_proxy (.env.uat), so no local model files are needed
      # and nothing reads these paths. Set both vars in .env.uat to real host directories only if
      # you switch a provider back to `local`.
      - "${EMBEDDING_MODEL_HOST:-./docker}:/models/e5:ro"
      - "${RERANKER_MODEL_HOST:-./docker}:/models/reranker:ro"

  worker:
    image: tsg:latest
    restart: unless-stopped
    # -c 50 = CONCURRENCY: this worker runs up to 50 tasks in parallel. With -P gevent those
    # are greenlets (cheap cooperative threads inside ONE process — right for our IO-bound
    # LLM/DB calls), not 50 OS processes. Because worker_prefetch_multiplier=1 is set in
    # app/pipeline/celery_app.py, 50 is ALSO the most messages this worker may reserve from
    # the queue — it can no longer hoard 4x that while others sit idle. Tune -c to LLM
    # capacity; remember each extra replica adds another 50 parallel slots on the same queue.
    # -Q celery is LOAD-BEARING: without it this worker also drains the `admin` queue and the
    # split in celery_app.py::task_routes does nothing.
    command: ["celery", "-A", "app.pipeline.celery_worker.celery_app", "worker",
              "-Q", "celery", "-P", "gevent", "-c", "50", "-l", "info"]
    env_file: [../.env.uat]   # UAT and production share one file (.env.prod.example documents it)
    depends_on:
      redis: { condition: service_healthy }
    # Compose's 10s default (SIGTERM then SIGKILL) is far shorter than a single in-flight LLM
    # call can legitimately take (llm_timeout_seconds x llm_max_retries = up to 270s), so every
    # routine restart/redeploy/scale-down would hard-kill mid-work instead of letting Celery's
    # warm shutdown finish it — the same "orphaned message" exposure a killed worker causes
    # (see app/pipeline/celery_app.py's visibility_timeout comment). 300s covers one full
    # LLM-call retry cycle; a reasoned starting point, not measured against this deployment's
    # real P99 stage duration — tune once that data exists.
    stop_grace_period: 300s
    # [REVIEW-FIX] worker previously had no healthcheck at all — a gevent greenlet deadlock
    # leaves the container process alive (Docker sees no crash) with nothing to restart it.
    # `inspect ping` only succeeds if the worker's event loop is actually responsive, not just
    # that the process exists. KNOWN LIMIT: plain docker compose never auto-restarts an
    # unhealthy-but-ALIVE container -- `restart: unless-stopped` acts on exits (crashes) only.
    # A hung worker therefore surfaces as "unhealthy" for monitoring and needs an operator (or
    # an autoheal sidecar / swarm, if that ever matters) to bounce it.
    # [REVIEW-FIX] start_period: `inspect ping` can't get a reply until Celery's Consumer
    # bootstep is up, which only happens AFTER the synchronous worker_init handler
    # (_init_worker, app/pipeline/celery_app.py) fully returns — a DB round-trip, a local
    # embedding+reranker model warm-load (EMBEDDING/RERANKER_PROVIDER=local is the documented
    # default; two real transformer models loaded from the bind-mounted volumes above) and an
    # LLM-provider reachability ping, all blocking, all before the first tick. That routinely
    # exceeds 30s (30s was measured against nothing — a reasoned starting point, tune down once
    # this deployment's real cold-start P99 is known); until then every ping fails not because
    # the worker is unhealthy but because it legitimately hasn't finished booting yet.
    healthcheck:
      test: ["CMD", "celery", "-A", "app.pipeline.celery_worker.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    volumes:
      # Defaults so an unset MODEL_HOST cannot abort `compose up`: this deployment runs
      # EMBEDDING/RERANKER_PROVIDER=litellm_proxy (.env.uat), so no local model files are needed
      # and nothing reads these paths. Set both vars in .env.uat to real host directories only if
      # you switch a provider back to `local`.
      - "${EMBEDDING_MODEL_HOST:-./docker}:/models/e5:ro"
      - "${RERANKER_MODEL_HOST:-./docker}:/models/reranker:ro"

  # The heavy operator jobs, off the queue users wait on. Routed here by
  # app/pipeline/celery_app.py::task_routes: technique rebuild, library import, embeddings,
  # grounding calibration. Measured reason for the split: a rebuild sharing the default queue
  # dragged live generation from ~355s to 967s and was itself killed at its time limit.
  #
  # -P prefork -c 1, NOT gevent -c 50. This work is CPU-bound (a 51 MB STIX parse, ~900 local
  # embeddings) and greenlets do nothing for CPU; one at a time also caps memory to a single
  # heavy job. prefork additionally makes Celery's SOFT time limit work -- on the gevent pool it
  # silently never fires, which is what let a rebuild be hard-killed instead of stopping early.
  #
  # If this service is absent, the API still returns 202 for those jobs and they never run.
  # /ready reports `workers_admin` for exactly that reason.
  worker-admin:
    image: tsg:latest
    restart: unless-stopped
    # -A celery_app, NOT celery_worker: celery_worker monkey-patches for gevent BEFORE any import; with a non-gevent pool there is no hub to drive those patched calls and the worker hangs in boot (observed: stops after 'mingle: sync complete', never reaches ready). Use the UNPATCHED app instead -- same reason beat uses it.
    command: ["celery", "-A", "app.pipeline.celery_app.celery_app", "worker",
              "-Q", "admin", "-P", "prefork", "-c", "1", "-l", "info"]
    env_file: [../.env.uat]
    depends_on:
      redis: { condition: service_healthy }
    stop_grace_period: 300s
    healthcheck:
      test: ["CMD", "celery", "-A", "app.pipeline.celery_app.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s

  beat:
    image: tsg:latest
    restart: unless-stopped
    command: ["celery", "-A", "app.pipeline.celery_app.celery_app", "beat", "-l", "info"]
    env_file: [../.env.uat]   # UAT and production share one file (.env.prod.example documents it)
    depends_on:
      redis: { condition: service_healthy }
    # [REVIEW-FIX] beat has no `inspect ping` equivalent, so this checks its own schedule
    # file's mtime instead. [REVIEW-FIX] the file is NOT touched every time an entry fires —
    # PersistentScheduler.should_sync() (celery/beat.py) is gated by Celery's own hardcoded
    # `Scheduler.sync_every = 180`, which this app never overrides (no beat_sync_every set), so
    # a disk sync only happens the first tick where time-since-last-sync exceeds 180s. Since
    # that check itself only runs on ~60s ticks (the reaper is the soonest-due entry), the real
    # write cadence is ~180-240s, not ~60s — so the file legitimately sits stale past 180s for
    # part of every normal cycle even while beat is perfectly healthy. 360s (2x the ~240s
    # worst-case real cadence) is comfortably above that, not just 3x an interval that isn't
    # actually how this scheduler behaves.
    healthcheck:
      test: ["CMD-SHELL", "find /app -maxdepth 1 -name 'celerybeat-schedule*' -newermt '-360 seconds' | grep -q ."]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Celery task dashboard. `-A` is app.pipeline.celery_app.celery_app, NOT celery_worker: the
  # latter monkey-patches gevent at import, which would corrupt Flower's own tornado event loop.
  # Same target beat and `inspect ping` already use. Tasks only appear here because
  # celery_app.py sets worker_send_task_events/task_send_sent_event — without those this UI is
  # live but empty.
  #
  # A MONITORING AID, NOT AN AUDIT TRAIL: history lives in flower.db and is capped/evictable.
  # The authoritative record of what the pipeline did is Scenario_Audit in the database.
  flower:
    image: tsg:latest
    restart: unless-stopped
    # --basic-auth is REQUIRED: Flower has no auth by default and exposes task revoke/terminate
    # to anyone who reaches the port. The guard lives HERE, in Flower's own startup, rather than
    # in the app's assert_security_posture(): that runs in the api/worker processes, which would
    # both force a Flower password onto deployments that never run this service AND still leave
    # Flower itself unguarded. Fail where the risk actually is.
    #
    # `$$` escapes compose interpolation so the SHELL expands it from the container env
    # (env_file, below) — this way the guard holds even if someone omits `--env-file` on the
    # host, which plain `${VAR}` interpolation would silently resolve to an empty string.
    command:
      - sh
      - -c
      - |
        test -n "$$TSG_FLOWER_BASIC_AUTH" || {
          echo "REFUSING TO START: TSG_FLOWER_BASIC_AUTH is empty. Flower exposes task revoke/terminate with no authentication. Set it in .env.uat." >&2
          exit 1
        }
        exec celery -A app.pipeline.celery_app.celery_app flower \
          --address=0.0.0.0 --port=5555 \
          --persistent=True --db=/data/flower.db \
          --basic-auth="$$TSG_FLOWER_BASIC_AUTH" \
          --logging=error
    env_file: [../.env.uat]   # UAT and production share one file (.env.prod.example documents it)
    depends_on:
      redis: { condition: service_healthy }
      # Without these, flower only waits on redis and starts the instant it's up -- racing the
      # worker's own multi-second local-model warm-load (see worker's healthcheck comment above)
      # and logging a burst of "Inspect method X failed" on every deploy. Waiting for the SAME
      # healthcheck conditions as the rest of the stack means flower is the LAST thing to come up,
      # so its first inspect round -- and the dashboard on first load -- has a fully-up stack.
      worker: { condition: service_healthy }
      beat: { condition: service_healthy }
      api: { condition: service_healthy }
    ports: ["5555:5555"]
    volumes: ["flower-data:/data"]
    healthcheck:
      # A plain TCP connect, deliberately: an HTTP probe would have to treat 401 as healthy
      # (auth is on and the probe sends no credentials), and encoding that exception handling
      # inside a YAML scalar is more fragile than it is informative. Port accepting == serving.
      # NOT `celery inspect ping` — this process is a broker CONSUMER, so that would report the
      # WORKERS' health, not Flower's.
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 5555), 4).close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    # Not in the original plan's four, but a crashed redis takes the whole stack down with it —
    # same one-line fix, no reason to leave the broker as the one unprotected piece.
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  flower-data:
