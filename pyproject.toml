[project]
name = "tsg"
version = "0.1.0"
description = "Threat Scenario Generator — AI pipeline for CII threat scenarios (built on SDD v1.1)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "gevent>=24.2",           # Celery pool: I/O-bound LLM waits, high concurrency per box
  "sqlalchemy>=2.0",
  "pyodbc>=5.1",            # mssql+pyodbc, ODBC Driver 17 (SDD §14)
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt[crypto]>=2.8",     # resource-server JWT validation only (SDD §10.1)
  "litellm>=1.40",
  "pymongo>=4.7",
  "structlog>=24.1",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27"]
local = ["sentence-transformers>=3.0"]   # local embedding + reranker (EMBEDDING/RERANKER_PROVIDER=local)
prod = ["gunicorn>=22.0"]                # production process manager for the API (uvicorn workers)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
