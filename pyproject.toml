[project]
name = "tsg"
version = "0.1.0"
description = "Threat Scenario Generator — AI pipeline for CII threat scenarios (built on SDD v1.1)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.1",
  "sse-starlette>=3.4.6",
  "celery[redis]>=5.6.3",
  "redis>=4.5.2,<6.5,!=4.5.5,!=5.0.2",  # capped by kombu[redis]'s own constraint (celery's redis transport)
  "gevent>=26.7.0",           # Celery pool: I/O-bound LLM waits, high concurrency per box
  "sqlalchemy>=2.0.51",
  "pyodbc>=5.3.0",            # mssql+pyodbc, ODBC Driver 17 
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "pyjwt[crypto]>=2.13.0",     # resource-server JWT validation only 
  "litellm>=1.95.0",
  "pymongo>=4.17.0",
  "structlog>=26.1.0",
  "flower>=2.0.1",
  # prometheus-client removed: it was declared but never imported, and no /metrics route exists
  # (`grep -rn "prometheus\|Counter(\|Histogram(" app/` finds nothing). Add it back together with
  # the endpoint and the instrumentation, not ahead of them.
  "numpy>=2.4.1",
  "httpx>=0.28.1",
  "ruff>=0.16.1",
  "pyyaml>=6.0.3",
  "mypy>=2.3.0",
  "tenacity>=9.1.4",
  "taxii2-client>=2.3",     # generic TAXII 2.1 pull (app/intel/taxii_client.py)
]

[project.optional-dependencies]
# httpx/ruff/mypy are already top-level dependencies above. The type stubs are dev-only: without
# them mypy reports `import-untyped` for yaml, which CI enforces as an error.
dev = ["pytest>=8.2", "types-PyYAML>=6.0"]
# >=5.0, not >=3.0: local_models.py calls get_embedding_dimension(), which replaced
# get_sentence_embedding_dimension() in 5.x (the old name still works but FutureWarns).
local = ["sentence-transformers>=5.0"]   # local embedding + reranker (EMBEDDING/RERANKER_PROVIDER=local)
prod = ["gunicorn>=22.0"]                # production process manager for the API (uvicorn workers)
# monitoring = ["flower>=2.0"]             # Celery dashboard for local dev; OpenShift uat uses the mher/flower image instead

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Without this, mypy treats every Settings field lacking a literal `= default` as a
# required constructor argument — it can't see that pydantic-settings actually resolves
# them from environment variables at runtime (Settings() below is called with zero args
# and works fine; mypy just doesn't know that without the plugin).
[tool.mypy]
plugins = ["pydantic.mypy"]

# gevent and celery ship no type hints (no py.typed marker) and no maintained stub package
# exists for either — this isn't a code error to fix, it's mypy correctly reporting it can't
# verify calls into an untyped library. Ignoring here (once, centrally) instead of a
# `# type: ignore` on every call site keeps the same intent from silently drifting out of sync
# across app/pipeline/local_models.py, app/pipeline/celery_app.py, and app/api/admin.py.
# taxii2-client is in the same boat, and is additionally an OPTIONAL, lazily-imported dependency
# (app/intel/taxii_client.py imports it inside the function), so the miss is expected, not a bug.
[[tool.mypy.overrides]]
module = ["gevent.*", "celery.*", "taxii2client.*"]
ignore_missing_imports = true

# Pins the linter that was already running here unconfigured (the stale .ruff_cache and the
# `# noqa: BLE001` markers are its fingerprints).
[tool.ruff]
line-length = 120

# EXPLICIT rule selection — do not delete this table and go back to ruff's defaults.
#
# This file previously set only `line-length` and relied on "the default rule set (E4/E7/E9 + F)".
# That was true when it was written and silently stopped being true: ruff 0.16 widened its
# defaults, which enforced ~20 new rule families overnight and left 157 `# noqa` directives dead
# (RUF100). Nobody noticed, because nothing ran ruff. Selecting explicitly means a ruff upgrade
# can never change what this repo enforces without a visible diff to THIS list.
#
# The list is "rules this codebase demonstrably already cares about" — every family below is
# either the historical default or is evidenced by existing `# noqa` markers in the tree:
#   E4/E7/E9, F  historical default (E501 deliberately absent: long dict literals are fine)
#   I            import order — deterministic and autofixable
#   UP           pyupgrade; the codebase is 3.11+ and already clean
#   B            bugbear real-bug patterns (see the flake8-bugbear table below — its presence
#                is the proof this family was intended)
#   BLE          blind excepts; the tree carries 5 deliberate `# noqa: BLE001` markers
#   LOG, G       logging correctness — cheap, and log calls are the production debugging surface
#   RUF          ruff-specific, and RUF100 (dead noqa) is what surfaced the drift above
#
# Deliberately NOT selected: SIM, RET, TRY, C4, PL*, DTZ, FURB, ANN, D. They are style opinions,
# were never enforced here, and their findings were all cosmetic churn in tests/ and scripts/.
# Add one only with a reason, never because it exists.
#
# S (bandit) is NOT selected either, despite the `# noqa: S310` markers in the tree. Those markers
# were themselves dead (ruff reported them as "non-enabled: S310"), so S has never actually run
# here — they were speculative. Enabling it fires S101 on all 568 `assert`s in tests/ and in
# treatment.py's self-check block, which is bandit being used for the wrong job. Turning on
# security scanning is a deliberate project, not a side effect of this config cleanup.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "LOG", "G", "RUF"]

ignore = [
    # SQLAlchemy Core turns `col == True` into a SQL expression. Ruff's suggested `if col:`
    # would instead evaluate the Column's Python truthiness and silently emit the WRONG QUERY.
    # Global, not per-file: this is a codebase-wide convention spanning 9 modules today, and a
    # per-file list would be stale the moment a tenth is written.
    "E712",
    # KNOWN RETROFIT, not an endorsement: `zip()` without `strict=` silently truncates to the
    # shorter input. There are 16 call sites and the right argument (True vs False) differs per
    # site, so a blanket autofix would be a behaviour change disguised as a lint fix. Left
    # visible here rather than fixed wrong. Remove this line and work through them site by site.
    "B905",
]

# FastAPI's dependency-injection markers are meant to be called in argument defaults
# (that's the documented way to use them) — B008 doesn't know that and flags every
# route handler that takes a Depends/Query/Path/Header param.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# (The former E712 entries for dal.py/accept.py/grounding.py moved to the global `ignore` above —
# the same pattern had spread to nine modules, so a per-file list was the wrong shape.)

# Deliberate `get_settings.cache_clear(); get_engine.cache_clear(); ...` triples.
"tests/conftest.py" = ["E702"]

# Pydantic forward refs and the response-model rebuild must run after the classes they name,
# so a handful of imports genuinely cannot sit at the top of the module.
"app/api/schemas.py" = ["E402"]

# scripts/ self-checks are standalone: they `sys.path.insert(0, ...)` to find `app` BEFORE
# importing it, which is exactly what E402 describes and exactly what they must do.
"scripts/calibrate_grounding.py" = ["E402"]
"scripts/smoke_local_models.py" = ["E402"]

# Test and self-check helpers: RUF012 (mutable class attr) and RUF015 (prefer next() over [0])
# are readability opinions that cost clarity in throwaway fixtures. Not applied to app/.
"tests/**" = ["RUF012", "RUF015"]
"scripts/test_*.py" = ["RUF012", "RUF015"]
